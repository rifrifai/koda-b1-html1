<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="" method="post">
        <label for="nama">Siapa nama Anda?</label><br/>
        <input type="text" name="nama" id="nama" />
    </form>
    <form action="" method="post">
        <label for="umur">Berapa umur Anda?</label><br/>
        <input type="text" name="umur" id="umur" />
    </form>
    <form action="" method="post">
        <label for="gender">Apa jenis kelamin Anda?</label><br/>
        <input type="radio" name="gender" id="gender1" />
        <label for="gender1">Laki-laki</label>
        <input type="radio" name="gender" id="gender2" />
        <label for="gender2">Perempuan</label>
    </form>
    <form action="" method="post">
        <label for="rokok">Apakah Anda perokok?</label><br/>
        <input type="radio" name="rokok" id="yes" />
        <label for="yes">Laki-laki</label>
        <input type="radio" name="rokok" id="no" />
        <label for="no">Perempuan</label>
    </form>
    <form action="">
        <label for="ifRokok">Jika Anda perokok, rokok apa yang anda pernah coba?</label><br/>
        <input type="checkbox" name="gg" id="gg"/>
        <label for="gg">Gudang Garam Filter</label><br/>
        <input type="checkbox" name="ls" id="ls">
        <label for="ls">Lucky Strike</label><br/>
        <input type="checkbox" name="marlboro" id="marlboro"/>
        <label for="marlboro">Marlboro</label><br/>
        <input type="checkbox" name="esse" id="esse" />
        <label for="esse">Esse</label><br/>
    </form>
</body>
</html>
